[project]
name = "counterstrat"
version = "0.1.0"
description = "Local CS2 anti-strat analyst: parse your opponents' demos, mine their tendencies, and chat with a tool-grounded AI about how to beat them."
readme = "README.md"
authors = [{ name = "Uzair (Git-Uzair)" }]
license = { file = "LICENSE" }
requires-python = ">=3.13"
dependencies = [
  "demoparser2==0.42.0",
  "awpy==2.0.2",
  "polars>=1.44",
  "duckdb>=1.5",
  "pyarrow>=25",
  "pandas>=2.2",
  "pydantic>=2.7",
  "PyYAML>=6",
  "scikit-learn>=1.5",
  "scipy>=1.14",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "zstandard>=0.23",
  "anthropic>=0.40",
  "google-genai>=1.0",
  "python-dotenv>=1.0",
]

[project.scripts]
counterstrat = "counterstrat.web.app:main"   # starts uvicorn on localhost

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
markers = ["demo: needs the real demo/VPK fixtures", "live: needs API keys"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
